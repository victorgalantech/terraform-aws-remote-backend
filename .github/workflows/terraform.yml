name: Terraform State Bucket CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feature/*
  pull_request:
    branches:
      - main
      - develop

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.6.0

jobs:
  terraform-validate:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=pro" >> $GITHUB_OUTPUT
            echo "secret_suffix=PROD" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" =~ ^refs/heads/release/.* ]]; then
            echo "environment=qa" >> $GITHUB_OUTPUT
            echo "secret_suffix=QA" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "secret_suffix=DEV" >> $GITHUB_OUTPUT
          fi
          echo "Environment: $(cat $GITHUB_OUTPUT | grep environment | cut -d'=' -f2)"
          echo "Secret suffix: $(cat $GITHUB_OUTPUT | grep secret_suffix | cut -d'=' -f2)"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ 
            steps.env.outputs.secret_suffix == 'PROD' && secrets.AWS_ACCESS_KEY_ID_PROD || 
            steps.env.outputs.secret_suffix == 'QA' && secrets.AWS_ACCESS_KEY_ID_QA || 
            secrets.AWS_ACCESS_KEY_ID_DEV }} 
          aws-secret-access-key: ${{ 
            steps.env.outputs.secret_suffix == 'PROD' && secrets.AWS_SECRET_ACCESS_KEY_PROD || 
            steps.env.outputs.secret_suffix == 'QA' && secrets.AWS_SECRET_ACCESS_KEY_QA || 
            secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Terraform Format Check
        id: fmt
        run: |
          echo "Checking Terraform formatting..."
          terraform fmt -check -diff || echo "Format check found issues but continuing..."
        continue-on-error: true
      
      - name: Terraform Init
        id: init
        run: terraform init
      
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
      
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var="environment=${{ steps.env.outputs.environment }}" \
            -out=tfplan
        continue-on-error: false
      
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
      
      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
            
            <details><summary>Show Plan</summary>
            
            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: plan
            });

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-validate
    
    defaults:
      run:
        working-directory: terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=pro" >> $GITHUB_OUTPUT
            echo "secret_suffix=PROD" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" =~ ^refs/heads/release/.* ]]; then
            echo "environment=qa" >> $GITHUB_OUTPUT
            echo "secret_suffix=QA" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "secret_suffix=DEV" >> $GITHUB_OUTPUT
          fi
          echo "Deploying to environment: $(cat $GITHUB_OUTPUT | grep environment | cut -d'=' -f2)"
          echo "Secret suffix: $(cat $GITHUB_OUTPUT | grep secret_suffix | cut -d'=' -f2)"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ 
            steps.env.outputs.secret_suffix == 'PROD' && secrets.AWS_ACCESS_KEY_ID_PROD || 
            steps.env.outputs.secret_suffix == 'QA' && secrets.AWS_ACCESS_KEY_ID_QA || 
            secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ 
            steps.env.outputs.secret_suffix == 'PROD' && secrets.AWS_SECRET_ACCESS_KEY_PROD || 
            steps.env.outputs.secret_suffix == 'QA' && secrets.AWS_SECRET_ACCESS_KEY_QA || 
            secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      
      - name: Terraform Init
        run: terraform init
      
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform
      
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan
      
      - name: Terraform Output
        id: output
        run: |
          echo "s3_bucket_id=$(terraform output -raw s3_bucket_id)" >> $GITHUB_OUTPUT
          echo "dynamodb_table_name=$(terraform output -raw dynamodb_table_name)" >> $GITHUB_OUTPUT
      
      - name: Display Backend Configuration
        run: |
          echo "## 🎉 Terraform State Backend Created Successfully!"
          echo ""
          echo "### Environment: ${{ steps.env.outputs.environment }}"
          echo "### S3 Bucket: ${{ steps.output.outputs.s3_bucket_id }}"
          echo "### DynamoDB Table: ${{ steps.output.outputs.dynamodb_table_name }}"
          echo ""
          echo "### Use this backend configuration in your projects:"
          terraform output -raw backend_config_example

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          output_format: cli
          soft_fail: true
          skip_check: CKV_AWS_144,CKV2_AWS_62,CKV_AWS_18,CKV_AWS_145,CKV_AWS_119
      
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true
